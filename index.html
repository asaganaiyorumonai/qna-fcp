<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>フロンティアQ&A</title>

  <!-- MSAL (Browser) -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.23.0/lib/msal-browser.min.js"></script>

  <!-- JSZip (出力: zip) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    :root { --bg:#0b0b0b; --fg:#fafafa; --muted:#b8b8b8; --accent:#3dd2ff; --chip:#1c1c1c;
            --danger:#ff5d5d; --ok:#5dff86; --border:#2a2a2a; }
    * { box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; padding:0; width:100vw; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui, sans-serif; overflow:hidden; }
    a { color: var(--accent); text-decoration:none; }

    .page { display:flex; flex-direction:column; width:100%; height:100dvh; }
    .header {
      position: relative;
      flex:0 0 56px;
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:12px;
      padding:8px 12px;
      border-bottom:1px solid var(--border);
      background:#0e0e0e;
      z-index:5;
    }
    .header-left { display:flex; align-items:center; gap:8px; min-width:0; }
    .backbtn {
      display:inline-flex; align-items:center; justify-content:center;
      padding:10px 14px; border-radius:12px;
      border:2px solid var(--border);
      background:#151515; font-weight:800; white-space:nowrap;
    }
    .header-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      text-align:center; font-size: clamp(18px, 4.5vw, 28px); font-weight:800;
      pointer-events: none; white-space: nowrap;
    }
    .header-right { justify-self:end; display:flex; gap:8px; align-items:center; }
    .hselect {
      height:38px; background:#0c0c0c; color:var(--fg);
      border:2px solid var(--border); border-radius:999px; padding:0 12px; font-weight:800;
    }
    .viewing-as { color:#aaa; font-size:12px; white-space:nowrap; }
    .notifbtn {
      position:relative; width:38px; height:38px; border-radius:50%;
      border:2px solid var(--border); background:#1b1b1b; color:#fff; font-weight:900;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .notifbtn:active { transform: scale(0.97); }
    .notifbtn .bell { font-size: 16px; line-height: 1; }
    .notif-dot {
      position:absolute; top:-4px; right:-4px; width:12px; height:12px; border-radius:50%;
      background:#ff4040; border:2px solid #0e0e0e; display:none;
    }
    .notifpanel {
      position: fixed; top:56px; left:50%; transform:translateX(-50%);
      width:min(720px, 92vw); max-height:min(60vh, 520px);
      overflow-y:auto; background:#131313; border:1px solid var(--border);
      border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.45);
      padding:8px; display:none; z-index:10;
    }
    .notif-title { font-weight:900; padding:8px 10px; border-bottom:1px solid #222; }
    .notif-empty { color:#bbb; padding:14px 10px; }
    .notif-row { display:flex; gap:10px; padding:10px; border-bottom:1px solid #1f1f1f; cursor:pointer; align-items:baseline; }
    .notif-row:last-child { border-bottom:none; }
    .notif-row .num { width:64px; flex:0 0 64px; color:#aaa; }
    .notif-row .txt { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .notif-row .tag { font-weight:900; margin-right:6px; }
    .st-unanswered { color:#c6c6c6; }
    .st-new { color:#fff; }
    .st-new .tag { color: var(--danger); }
    .st-seen { color:#444; }

    .content { flex:1 1 auto; display:flex; flex-direction:column; padding:8px 12px; gap:12px; min-height:0; }
    .title { text-align:center; font-size: clamp(20px, 5vw, 40px); font-weight:800; letter-spacing:1px; }
    .chips { display:grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap:12px; flex:1; min-height:0; }
    .chip {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:#1c1c1c; border:2px solid var(--border); border-radius:18px;
      font-size: clamp(16px, 4vw, 28px); font-weight:800;
      transition:.1s transform,.1s background; padding:16px; text-align:center;
    }
    .chip:active { transform: scale(0.98); background:#222; }
    .subtxt { margin-top:6px; color:#b8b8b8; font-weight:600; font-size:.8em; }

    .row { display:flex; gap:12px; flex:1; min-height:0; }
    .pane {
      background:#101010; border:2px solid var(--border); border-radius:18px;
      padding:12px; display:flex; flex-direction:column; gap:10px; min-height:0;
    }
    .pane.left { flex:1; min-width:0; }
    .pane.right { flex:1; min-width:0; }

    .btn {
      appearance:none; border:none; border-radius:14px; background:#1f1f1f;
      color:#fff; padding:12px 16px; font-size: clamp(14px, 3.2vw, 20px);
      font-weight:700; border:2px solid var(--border); white-space:nowrap;
      cursor:pointer;
    }
    .btn.ok { background:#0f2; color:#000; }
    .btn.accent { background:#0af; color:#000; }
    .btn.danger { background:#ff4040; color:#fff; }

    .fields { display:flex; gap:10px; }
    .select, .input, .textarea, .file {
      width:100%;
      font-size: clamp(14px, 3vw, 18px);
      padding:12px;
      background:#0c0c0c;
      color:var(--fg);
      border:2px solid var(--border);
      border-radius:12px;
    }
    .select, .file { height:54px; }
    .textarea { flex:1; resize:none; min-height:120px; }

    .tabs { display:flex; gap:8px; flex-wrap:wrap; }
    .tab { padding:8px 12px; border-radius:999px; border:2px solid var(--border); background:#151515; font-weight:800; cursor:pointer; }
    .tab.sel { background:#0af; color:#000; }

    .hscroll { overflow-y:auto; border-radius:12px; border:1px solid var(--border); background:#0d0d0d; padding:8px; min-height:0; }
    .listrow { display:grid; grid-template-columns: 90px 160px 140px 1fr; gap:8px; padding:10px; border-bottom:1px solid #222; cursor:pointer; }
    .checklisthead { display:grid; grid-template-columns: 40px 90px 160px 160px 1fr; gap:8px; padding:8px 10px; border-bottom:1px solid #222; color:#bbb; font-weight:900; }
    .checklistrow { display:grid; grid-template-columns: 40px 90px 160px 160px 1fr; gap:8px; padding:10px; border-bottom:1px solid #222; align-items:center; }
    .badge { display:inline-block; padding:6px 10px; border-radius:999px; border:1px solid var(--border); background:#141414; font-size:12px; color:#aaa; }
    .badge.lg { font-size:18px; font-weight:900; }

    .imgwin {
      position:relative; flex:1; min-height:220px;
      background:#000; border:1px solid #333; border-radius:14px;
      overflow:hidden; touch-action:none;
      display:flex; align-items:center; justify-content:center;
    }
    .imgwin img {
      max-width:100%;
      max-height:100%;
      object-fit:contain;
    }

    .bottom-actions { margin-top:auto; display:flex; flex-direction:column; gap:10px; }
    .bigbtn { width:100%; height:64px; font-size: clamp(16px, 4vw, 24px); }
    .msg { text-align:center; color:#ffb; font-size:14px; }

    /* sending overlay */
    .sending-mask { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:9999; }
    .sending-box { background:#111; border:1px solid var(--border); border-radius:16px; padding:20px 24px; width:min(360px, 90vw); text-align:center; }
    .sending-title { font-weight:900; margin-bottom:10px; }
    .bar { height:10px; background:#222; border-radius:999px; overflow:hidden; border:1px solid #333; }
    .bar > div { height:100%; width:0%; transition: width .25s ease; background: var(--accent); }
  </style>
</head>

<body>
  <div id="app"></div>

  <div class="sending-mask" id="sendingMask">
    <div class="sending-box">
      <div class="sending-title" id="sendingTitle">送信中...</div>
      <div class="bar"><div id="sendingBar"></div></div>
      <div class="msg" id="sendingMsg" style="margin-top:10px;"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
