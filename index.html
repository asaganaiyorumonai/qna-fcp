<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>フロンティアQ&A</title>

  <link rel="stylesheet" href="./app.css" />

  <!-- MSAL (Microsoft Entra / AAD) -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.20.0/lib/msal-browser.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <button class="btn pill" id="btnBack" style="display:none;">← 前のページに戻る</button>
        <div class="viewerbox">
          <div class="viewer-pill" id="viewerPill">ゲスト</div>
          <div class="viewer-sub">として閲覧中</div>
        </div>
        <button class="bell" id="btnBell" title="通知（ダミー）">
          🔔 <span id="notifDot" class="notif-dot" style="display:none;"></span>
        </button>
      </div>

      <div class="header-title" id="headerTitle">ホーム</div>

      <div class="header-right">
        <button class="btn pill accent" id="btnLogin">Microsoftでログイン</button>
        <button class="btn pill" id="btnLogout" style="display:none;">ログアウト</button>
      </div>
    </div>

    <!-- Content -->
    <div class="content" id="appRoot"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
