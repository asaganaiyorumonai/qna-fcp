<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>フロンティアQ&A</title>

  <!-- MSAL（まずMicrosoft公式CDN → 失敗したらjsdelivrへフォールバック） -->
  <script>
    (function(){
      function load(src){
        return new Promise((resolve,reject)=>{
          const s=document.createElement("script");
          s.src=src; s.async=true;
          s.onload=()=>resolve();
          s.onerror=()=>reject(new Error("load failed: "+src));
          document.head.appendChild(s);
        });
      }
      // どちらか成功したらOK
      load("https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js")
        .catch(()=>load("https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.23.0/lib/msal-browser.min.js"))
        .catch((e)=>{ window.__MSAL_LOAD_ERROR__ = String(e); });
    })();
  </script>

  <style>
    :root { --bg:#0b0b0b; --fg:#fafafa; --muted:#b8b8b8; --accent:#3dd2ff; --border:#2a2a2a; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui, sans-serif; overflow:hidden; }
    .page { display:flex; flex-direction:column; width:100%; height:100dvh; }
    .header { flex:0 0 56px; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--border); background:#0e0e0e; font-weight:900; font-size:20px; }
    .content { flex:1; display:flex; align-items:center; justify-content:center; padding:16px; }
    .bootbox { width:min(720px, 92vw); border:1px solid var(--border); border-radius:16px; background:#101010; padding:18px; }
    .bootbox .t { font-weight:900; margin-bottom:8px; }
    .bootbox .m { color:var(--muted); white-space:pre-wrap; }
    .btn { margin-top:12px; padding:10px 14px; border-radius:12px; border:1px solid var(--border); background:#1c1c1c; color:#fff; font-weight:800; cursor:pointer; }
  </style>
</head>

<body>
  <div id="app">
    <!-- 何があっても真っ黒にしないための初期表示 -->
    <div class="page">
      <div class="header">フロンティアQ&A</div>
      <div class="content">
        <div class="bootbox">
          <div class="t">読み込み中...</div>
          <div class="m" id="bootMsg">app.js を読み込んでいます</div>
          <button class="btn" onclick="location.reload()">再読み込み</button>
        </div>
      </div>
    </div>
  </div>

  <!-- app.js は defer 推奨（DOM構築後に実行） -->
  <script defer src="./app.js"></script>
</body>
</html>
